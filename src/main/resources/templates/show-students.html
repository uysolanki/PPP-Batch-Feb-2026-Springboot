<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<a href="/saveStudentForm" class="btn btn-secondary mt-3 ml-5">Add Student</a>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Student List</h2>
	
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Roll Number</th>
                    <th scope="col">Student Name</th>
                    <th scope="col">Percentage</th>
                    <th scope="col">Department</th>
                    <th scope="col">Delete</th>
                    <th scope="col">Update</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.rno}"></td>
                    <td th:text="${student.sname}"></td>
                    <td th:text="${student.dname}"></td>
                    <td th:text="${student.per}"></td>
                    <td> <a th:href="@{'/deleteStudentFE/' + ${student.rno}}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('Are you sure you want to delete this Student?');">Delete </a> </td>
					<td> <a th:href="@{'/updateStudentForm/' + ${student.rno}}" class="btn btn-primary btn-sm" 
                       onclick="return confirm('Are you sure you want to delete this Student?');">Update </a> </td>
					
                 </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS Bundle (optional for dropdowns, modals, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
