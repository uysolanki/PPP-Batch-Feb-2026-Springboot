<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Student</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<div class="container mt-5">
		<h2 class="mb-4 text-center">Add New Student</h2>

		<form th:action="@{/saveStudentFE}" th:object="${student}" method="post"
			class="card p-4 shadow-sm">
			<div class="mb-3">
				<label for="rno" class="form-label">Student Roll Number</label> <input
					type="text" th:field="*{rno}" class="form-control" id="rno"
					placeholder="Enter Student Roll Number">
			</div>
			<div class="mb-3">
				<label for="sname" class="form-label">Student Name</label> <input
					type="text" th:field="*{sname}" class="form-control" id="sname"
					placeholder="Enter Student Name" required>
			</div>
			<div class="mb-3">
				<label for="per" class="form-label">Percentage</label> <input
					type="text" th:field="*{per}" class="form-control" id="per"
					placeholder="Enter Percentage" required>
			</div>
			<div class="mb-3">
				<label for="dname" class="form-label">Department Name</label> <input
					type="text" th:field="*{dname}" class="form-control" id="dname"
					placeholder="Enter Department Name" required>
			</div>
			<button type="submit" class="btn btn-success">Save Student</button>
		</form>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
